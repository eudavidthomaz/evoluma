<!doctype html>
<!--
  Formulário de inscrição no beta do EVOLUMA Studio.

  Por que é um arquivo estático e não uma Edge Function: o domínio
  *.supabase.co devolve `text/plain` + `nosniff` para qualquer HTML, tanto em
  Edge Functions quanto em Storage — é trava anti-phishing da plataforma, e não
  há como contorná-la. O que fica no Supabase é só o endpoint JSON.

  Esta pasta se chama `docs/` porque é a que o GitHub Pages publica direto da
  branch principal, sem build nenhum.
-->
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>EVOLUMA Studio — inscrição no beta</title>
<meta property="og:title" content="EVOLUMA Studio — beta fechado">
<meta property="og:description" content="Edição e seleção de fotografia em lote. Inscreva-se para receber seu acesso.">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0b0e13;color:#dbe3ea;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:24px}
.card{width:min(430px,100%);background:#12161c;border:1px solid #2c333b;border-radius:16px;padding:26px}
h1{margin:0 0 4px;font-size:19px;letter-spacing:-.01em}
.sub{margin:0 0 22px;font-size:13px;color:#8b949d}
label{display:block;margin-bottom:14px}
label span{display:block;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:#8b949d;margin-bottom:6px}
/* 16px no input não é estética: abaixo disso o Safari do iPhone dá zoom
   automático ao focar, e o formulário "pula" na cara de quem abriu do grupo. */
input{width:100%;background:#0d1116;border:1px solid #2c333b;border-radius:9px;padding:12px;color:#e8eef4;font-size:16px;font-family:inherit}
input:focus{outline:none;border-color:#b8e04a}
.oculto{position:absolute;left:-9999px}
button{width:100%;margin-top:8px;background:#b8e04a;border:0;border-radius:10px;padding:14px;color:#10130a;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.aviso{margin:16px 0 0;font-size:11px;color:#68727b;line-height:1.5}
.msg{margin:14px 0 0;font-size:13px;padding:12px;border-radius:9px;display:none}
.msg.erro{display:block;background:#2a1512;color:#ff8d80;border:1px solid #5d302b}
.pronto{text-align:center}
.pronto .marca{font-size:40px;line-height:1;color:#b8e04a}
.pronto h2{font-size:17px;margin:14px 0 8px}
.pronto p{font-size:13px;color:#8b949d;margin:0}
</style></head>
<body>
<div class="card" id="cartao">
  <h1>EVOLUMA Studio</h1>
  <p class="sub">Inscrição no beta fechado — edição e seleção de fotografia em lote.</p>
  <form id="form" novalidate>
    <label><span>Nome completo</span><input name="full_name" autocomplete="name" required></label>
    <label><span>E-mail</span><input name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" required></label>
    <label><span>WhatsApp com DDD</span><input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(11) 91234-5678" required></label>
    <label><span>Câmera que você usa (opcional)</span><input name="camera" placeholder="Fujifilm X-T5, Canon R6…"></label>
    <!-- Armadilha para robô: invisível para gente, irresistível para
         preenchedor automático. Quem preenche recebe "sucesso" e nada é gravado. -->
    <label class="oculto" aria-hidden="true"><span>Site</span><input name="site" tabindex="-1" autocomplete="off"></label>
    <button type="submit" id="enviar">Quero participar</button>
    <p class="msg" id="msg"></p>
  </form>
  <p class="aviso">Usamos esses dados só para liberar seu acesso ao beta e avisar sobre atualizações. Não compartilhamos com ninguém. Para sair da lista, responda no grupo ou escreva para o e-mail do convite.</p>
</div>
<script>
const ENDPOINT = "https://uuixcktluyyxzfuwqmim.supabase.co/functions/v1/inscricao";
const form = document.getElementById('form');
const botao = document.getElementById('enviar');
const msg = document.getElementById('msg');
form.addEventListener('submit', async (evento) => {
  evento.preventDefault();
  msg.className = 'msg';
  botao.disabled = true;
  botao.textContent = 'Enviando…';
  const dados = Object.fromEntries(new FormData(form).entries());
  try {
    const resposta = await fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(dados),
    });
    const corpo = await resposta.json().catch(() => ({}));
    if (!resposta.ok) throw new Error(corpo.erro || 'Não foi possível enviar');
    document.getElementById('cartao').innerHTML =
      '<div class="pronto"><div class="marca">✓</div><h2>' +
      (corpo.repetido ? 'Você já está na lista' : 'Inscrição recebida') +
      '</h2><p>Vamos conferir seu cadastro e liberar o acesso. Você receberá um e-mail com o link para baixar o EVOLUMA e entrar.</p></div>';
  } catch (falha) {
    msg.className = 'msg erro';
    msg.textContent = falha.message;
    botao.disabled = false;
    botao.textContent = 'Quero participar';
  }
});
</script>
</body></html>
